services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc
    container_name: homebox
    restart: always
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=10
      - HBOX_OPTIONS_ALLOW_ANALYTICS=true
      # Database
      - HBOX_DATABASE_DRIVER=postgres
      - HBOX_DATABASE_HOST=${HBOX_DATABASE_HOST:?HBOX_DATABASE_HOST must be set}
      - HBOX_DATABASE_PORT=5432
      - HBOX_DATABASE_USERNAME=homebox
      - HBOX_DATABASE_PASSWORD=${HBOX_DATABASE_PASSWORD}
      - HBOX_DATABASE_DATABASE=homebox
      # Storage
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - HBOX_STORAGE_CONN_STRING=${HBOX_STORAGE_CONN_STRING:?HBOX_STORAGE_CONN_STRING must be set}
      # OIDC
      - HBOX_OPTIONS_HOSTNAME=${HBOX_OPTIONS_HOSTNAME:?HBOX_OPTIONS_HOSTNAME must be set}
      - HBOX_OIDC_ENABLED=true
      - HBOX_OIDC_ISSUER_URL=${HBOX_OIDC_ISSUER_URL:?HBOX_OIDC_ISSUER_URL must be set}
      - HBOX_OIDC_CLIENT_ID=homebox
      - HBOX_OIDC_CLIENT_SECRET=${HBOX_OIDC_CLIENT_SECRET}
      - HBOX_OPTIONS_TRUST_PROXY=true
    volumes:
      - homebox-data:/data/
    ports:
      - 3100:7745

volumes:
  homebox-data:
    driver: local
