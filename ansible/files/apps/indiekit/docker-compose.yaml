name: indiekit
services:
  indiekit:
    image: ${INDIEKIT_IMAGE:?INDIEKIT_IMAGE must be set}
    pull_policy: always
    container_name: indiekit
    restart: always
    ports:
      - ${HTTP_PORT:-3000}:3000
    environment:
      - TZ=${TZ}
      - MONGO_URL=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo
      - PASSWORD_SECRET
      - SECRET
      - GITHUB_TOKEN
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  mongo:
    image: mongo:9@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    restart: always
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'quit(db.adminCommand("ping").ok ? 0 : 2)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  mongo: {}
