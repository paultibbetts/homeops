name: indiekit
services:
  indiekit:
    image: ${INDIEKIT_IMAGE:?INDIEKIT_IMAGE must be set}
    pull_policy: always
    container_name: indiekit
    restart: always
    ports:
      - ${HTTP_PORT:-3000}:3000
    environment:
      - MONGO_URL=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo
      - PASSWORD_SECRET
      - SECRET
      - GITHUB_TOKEN
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
  mongo:
    image: mongo:8@sha256:d0c8f51bb63fb1f992f4ff05293adb3f0967aaaae32c3e5fa567907800819b3b
    restart: always
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
volumes:
  mongo: {}
