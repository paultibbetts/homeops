name: indiekit
services:
  indiekit:
    image: ${INDIEKIT_IMAGE:?INDIEKIT_IMAGE must be set}
    pull_policy: always
    container_name: indiekit
    restart: always
    ports:
      - ${HTTP_PORT:-3000}:3000
    environment:
      - MONGO_URL=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo
      - PASSWORD_SECRET
      - SECRET
      - GITHUB_TOKEN
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
  mongo:
    image: mongo:8@sha256:81a1c8842a09589fc8d5f285266f3340bf4abdf66700ba22988f14cc9b2b3118
    restart: always
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
volumes:
  mongo: {}
