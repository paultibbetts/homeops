services:
  parser:
    image: ${PARSER_IMAGE:?PARSER_IMAGE must be set}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    pull_policy: always
    environment:
      MEALIE_ENRICHER_MEALIE_BASE_URL: "${MEALIE_ENRICHER_MEALIE_BASE_URL:?MEALIE_ENRICHER_MEALIE_BASE_URL must be set}"
      MEALIE_ENRICHER_MEALIE_TOKEN: "${MEALIE_TOKEN}"
      MEALIE_ENRICHER_PARSER_BASE_URL: "http://parser:8000"
    ports:
      - "9001:8080"
    depends_on:
      parser:
        condition: service_healthy
