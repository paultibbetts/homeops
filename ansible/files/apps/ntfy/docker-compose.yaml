services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: Europe/London
      # Reverse proxy
      NTFY_BASE_URL: ${NTFY_BASE_URL:?NTFY_BASE_URL must be set}
      NTFY_BEHIND_PROXY: true
      # Persistence
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # Auth
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: true
      # iOS
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      # Web Push
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${NTFY_WEB_PUSH_EMAIL_ADDRESS:?NTFY_WEB_PUSH_EMAIL_ADDRESS must be set}
    env_file:
      - .env
    user: 1004:1004
    volumes:
      - ./data:/var/cache/ntfy
    ports:
      - 8093:80
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo
            '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes
