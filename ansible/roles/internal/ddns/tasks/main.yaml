---
- name: DDNS
  block:
    - name: Validate required DuckDNS variables
      ansible.builtin.assert:
        that:
          - duckdns_domain is defined
          - duckdns_domain | trim | length > 0
          - duckdns_token is defined
          - duckdns_token | trim | length > 0

    - name: Install requirements
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Template script
      ansible.builtin.template:
        src: duck.sh.j2
        dest: "{{ ddns_script_path }}"
        mode: "0700"

    - name: Add script to CRON
      ansible.builtin.cron:
        name: ddns
        minute: "5"
        job: "{{ ddns_script_path }}"
