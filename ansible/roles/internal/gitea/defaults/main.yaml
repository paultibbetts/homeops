---
# Gitea Version
gitea_version: 1.21.7

# Path to the Gitea binary
gitea_binary: /home/gitea/bin/gitea

# Path to the file containing the ENV configuration variables for gitea
gitea_env_file: /etc/default/gitea

# Gitea home directory
gitea_working_directory: /home/gitea

# Runtime user and group for the gitea service
gitea_user: git
gitea_group: git

# Optional repo-specific customizations.
gitea_custom_path: "{{ gitea_binary | dirname }}/custom"
gitea_custom_label_set_src_dir: "{{ playbook_dir }}/../files/gitea/labels"
gitea_custom_label_sets: []
