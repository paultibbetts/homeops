---
- name: Derive hostname values from inventory
  ansible.builtin.set_fact:
    common_host_short: "{{ common_hostname_short | default(inventory_hostname_short) }}"
    common_host_fqdn: "{{ common_hostname_fqdn | default(inventory_hostname) }}"

- name: Set system hostname (short)
  ansible.builtin.hostname:
    name: "{{ common_host_short }}"

- name: Ensure /etc/hosts has hostname entries (Debian/Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ common_host_fqdn }} {{ common_host_short }}"
    create: true
    mode: "0644"
  when: ansible_facts.os_family == "Debian"
