---
- name: Validate container runtime task inputs
  ansible.builtin.assert:
    that:
      - common_container_runtime_command_effective | length > 0
    fail_msg: >
      container runtime validation requires a non-empty command value.
  vars:
    common_container_runtime_command_effective: "{{ container_runtime_command | default('docker') }}"

- name: Check CLI availability for {{ container_runtime_command | default('docker') }}
  ansible.builtin.command:
    cmd: "{{ container_runtime_command | default('docker') }} --version"
  register: common_container_runtime_cli_check
  changed_when: false
  failed_when: false

- name: Assert CLI is available for {{ container_runtime_command | default('docker') }}
  ansible.builtin.assert:
    that:
      - common_container_runtime_cli_check.rc == 0

- name: Check compose support for {{ container_runtime_command | default('docker') }}
  ansible.builtin.command:
    cmd: "{{ container_runtime_command | default('docker') }} compose version"
  register: common_container_runtime_compose_check
  changed_when: false
  failed_when: false
  when: container_runtime_needs_compose | default(true) | bool

- name: Assert compose support is available for {{ container_runtime_command | default('docker') }}
  ansible.builtin.assert:
    that:
      - common_container_runtime_compose_check.rc == 0
  when: container_runtime_needs_compose | default(true) | bool
