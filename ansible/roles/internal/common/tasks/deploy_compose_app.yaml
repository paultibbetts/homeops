---
- name: "Validate required variables for {{ app_name }}"
  ansible.builtin.assert:
    that:
      - app_name | default('') | length > 0
      - app_path | default('') | length > 0
      - compose_src | default('') | length > 0
    fail_msg: "You must set app_name, app_path, and compose_src when including deploy_compose_app."

- name: "Deploy compose app for {{ app_name }}"
  vars:
    compose_app_user: "{{ app_user | default(ops_user | default(ansible_facts['user_id'])) }}"
    compose_app_group: "{{ app_group | default(app_user | default(ops_user | default(ansible_facts['user_id']))) }}"
    compose_app_become_fs: "{{ app_become | default(app_path is match('^/')) | bool }}"
    compose_app_extra_src_base: "{{ extra_copy_src_base | default((playbook_dir | dirname) ~ '/files/apps/' ~ app_name) }}"
    compose_app_volume_paths: >-
      {{ volume_dirs | default([]) | map('regex_replace', '^(?!/)', app_path ~ '/') | list }}
  block:
    - name: "Ensure app directory and volume roots for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0755"
      loop: "{{ [app_path] + compose_app_volume_paths }}"

    - name: "Copy docker-compose.yaml for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ app_path }}/docker-compose.yaml"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0644"

    - name: "Render .env from template for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.template:
        src: "{{ env_template }}"
        dest: "{{ app_path }}/.env"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0600"
      when:
        - env_template is defined
        - env_template != omit

    - name: "Copy extra directories for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.copy:
        src: "{{ compose_app_extra_src_base }}/{{ item }}/"
        dest: "{{ app_path }}/{{ item }}/"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0644"
        directory_mode: "0755"
      loop: "{{ extra_copy_dirs | default([]) }}"
      when:
        - extra_copy_dirs | default([]) | length > 0

    - name: "Copy extra files for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.copy:
        src: "{{ compose_app_extra_src_base }}/{{ item }}"
        dest: "{{ app_path }}/{{ item }}"
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        mode: "0644"
      loop: "{{ extra_copy_files | default([]) }}"
      when:
        - extra_copy_files | default([]) | length > 0

    - name: "Run docker compose for {{ app_name }}"
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        project_name: "{{ app_name }}"
        remove_orphans: true
      when: not ansible_check_mode

    - name: "Enforce ownership on volume roots for {{ app_name }}"
      become: "{{ compose_app_become_fs }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ compose_app_user }}"
        group: "{{ compose_app_group }}"
        recurse: true
      loop: "{{ compose_app_volume_paths }}"
      when:
        - not ansible_check_mode
        - enforce_volume_ownership | default(false)
        - compose_app_volume_paths | length > 0
