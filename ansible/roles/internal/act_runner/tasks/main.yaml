---
- name: Validate act_runner platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.architecture in ["x86_64", "amd64"]
    fail_msg: >-
      act_runner currently supports Debian-family x86_64 only in this role.
      Got os_family={{ ansible_facts.os_family }}, arch={{ ansible_facts.architecture }}.

- name: Validate act_runner settings
  ansible.builtin.assert:
    that:
      - act_runner_instance_url | length > 0
      - act_runner_name | length > 0
      - act_runner_labels is iterable
      - act_runner_labels is not string
      - act_runner_labels | length > 0
      - act_runner_capacity | int > 0
      - act_runner_cache_port | int > 0
    fail_msg: >-
      act_runner requires act_runner_instance_url, act_runner_name, at least one
      label, and positive capacity/cache port values.

- name: Install act_runner support packages
  ansible.builtin.package:
    name:
      - acl
      - ca-certificates
    state: present

- name: Create act_runner group
  ansible.builtin.group:
    name: "{{ act_runner_group }}"
    state: present

- name: Create act_runner user
  ansible.builtin.user:
    name: "{{ act_runner_user }}"
    group: "{{ act_runner_group }}"
    groups: docker
    append: true
    home: "{{ act_runner_working_directory }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true
    comment: Gitea Actions runner

- name: Ensure act_runner directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(act_runner_user) }}"
    group: "{{ item.group | default(act_runner_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ act_runner_config_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ act_runner_working_directory }}"
      mode: "0750"
    - path: "{{ act_runner_cache_dir }}"
      mode: "0750"
    - path: "{{ act_runner_container_workdir_parent }}"
      mode: "0750"
    - path: "{{ act_runner_host_workdir_parent }}"
      mode: "0750"

- name: Download act_runner binary
  ansible.builtin.get_url:
    url: "{{ act_runner_download_url }}"
    checksum: "sha256:{{ act_runner_download_checksum_url }}"
    dest: "{{ act_runner_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart act_runner

- name: Verify act_runner binary runs
  ansible.builtin.command:
    argv:
      - "{{ act_runner_binary_path }}"
      - --version
  register: act_runner_version_check
  changed_when: false

- name: Render act_runner config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ act_runner_config_path }}"
    owner: root
    group: "{{ act_runner_group }}"
    mode: "0640"
  notify: Restart act_runner

- name: Check act_runner registration state
  ansible.builtin.stat:
    path: "{{ act_runner_runner_file }}"
  register: act_runner_registration_state

- name: Validate act_runner registration token
  ansible.builtin.assert:
    that:
      - act_runner_registration_token | length > 0
    fail_msg: >-
      act_runner_registration_token is required for initial registration. Put
      it in Ansible Vault for the gitea_runner group, then rerun this play.
  when: not act_runner_registration_state.stat.exists
  no_log: true

- name: Register act_runner
  become: true
  become_user: "{{ act_runner_user }}"
  ansible.builtin.command:
    argv:
      - "{{ act_runner_binary_path }}"
      - register
      - --config
      - "{{ act_runner_config_path }}"
      - --no-interactive
      - --instance
      - "{{ act_runner_instance_url }}"
      - --token
      - "{{ act_runner_registration_token }}"
      - --name
      - "{{ act_runner_name }}"
      - --labels
      - "{{ act_runner_labels | join(',') }}"
    chdir: "{{ act_runner_working_directory }}"
    creates: "{{ act_runner_runner_file }}"
  when: not act_runner_registration_state.stat.exists
  no_log: true
  notify: Restart act_runner

- name: Render act_runner systemd unit
  ansible.builtin.template:
    src: act_runner.service.j2
    dest: /etc/systemd/system/act_runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart act_runner

- name: Enable and start act_runner
  ansible.builtin.systemd:
    name: act_runner
    state: started
    enabled: true
    daemon_reload: true
