---
- name: Render Pangolin docker compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ pangolin_project_dir }}/docker-compose.yaml"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_file_mode }}"
  notify: pangolin_compose_changed

- name: Render Pangolin application config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ pangolin_project_dir }}/config/config.yaml"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_file_mode }}"
  notify: pangolin_compose_changed
  no_log: true

- name: Render Pangolin private config
  ansible.builtin.template:
    src: privateConfig.yml.j2
    dest: "{{ pangolin_project_dir }}/config/privateConfig.yml"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_secret_file_mode }}"
  when:
    - pangolin_edition == "enterprise"
    - pangolin_private_config | length > 0
  notify: pangolin_compose_changed
  no_log: true

- name: Remove unused Pangolin private config
  ansible.builtin.file:
    path: "{{ pangolin_project_dir }}/config/privateConfig.yml"
    state: absent
  when: pangolin_edition != "enterprise" or pangolin_private_config | length == 0
  notify: pangolin_compose_changed

- name: Render Traefik static configuration
  ansible.builtin.template:
    src: traefik_config.yaml.j2
    dest: "{{ pangolin_project_dir }}/config/traefik/traefik_config.yaml"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_file_mode }}"
  notify: pangolin_compose_changed

- name: Render Traefik dynamic configuration
  ansible.builtin.template:
    src: traefik_dynamic.yaml.j2
    dest: "{{ pangolin_project_dir }}/config/traefik/dynamic_config.yaml"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_file_mode }}"
  notify: pangolin_compose_changed
  no_log: true

- name: Deploy CrowdSec config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ pangolin_project_dir }}/config/crowdsec/{{ item.dest }}"
    owner: "{{ pangolin_owner_user }}"
    group: "{{ pangolin_owner_group }}"
    mode: "{{ pangolin_file_mode }}"
  loop:
    - { src: "crowdsec/profiles.yaml", dest: "profiles.yaml" }
    - { src: "crowdsec/acquis.d/appsec.yaml", dest: "acquis.d/appsec.yaml" }
    - { src: "crowdsec/acquis.d/traefik.yaml", dest: "acquis.d/traefik.yaml" }
  when: pangolin_enable_crowdsec | bool
  notify: pangolin_compose_changed
