---
- name: Validate Pangolin domains and identity
  ansible.builtin.assert:
    that:
      - pangolin_base_domain | length > 0
      - pangolin_dashboard_domain | length > 0
      - pangolin_letsencrypt_email | length > 0
    fail_msg: >
      Pangolin requires pangolin_base_domain, pangolin_dashboard_domain, and
      pangolin_letsencrypt_email to be set.

- name: Validate Pangolin server secret
  ansible.builtin.assert:
    that:
      - pangolin_server_secret | length > 0
    fail_msg: >
      pangolin_server_secret is required. Generate one with:
      openssl rand -base64 24 | tr -d '\n'
  no_log: true

- name: Assert pangolin_runtime is docker or podman
  ansible.builtin.assert:
    that:
      - pangolin_runtime in ["docker", "podman"]

- name: Assert pangolin_edition is community or enterprise
  ansible.builtin.assert:
    that:
      - pangolin_edition in ["community", "enterprise"]

- name: Assert pangolin_acme_challenge_type is http or dns
  ansible.builtin.assert:
    that:
      - pangolin_acme_challenge_type in ["http", "dns"]

- name: Validate Pangolin ACME DNS challenge settings
  ansible.builtin.assert:
    that:
      - pangolin_acme_dns_provider == "cloudflare"
      - pangolin_cloudflare_dns_api_token | string | length > 0
    fail_msg: >
      pangolin_acme_challenge_type is dns, but Cloudflare DNS challenge settings are missing.
      Set pangolin_acme_dns_provider to cloudflare and pangolin_cloudflare_dns_api_token in Vault.
  when: pangolin_acme_challenge_type == "dns"
  no_log: true

- name: Validate Pangolin SMTP configuration
  ansible.builtin.assert:
    that:
      - pangolin_smtp_host | length > 0
      - pangolin_smtp_port | string | length > 0
      - pangolin_smtp_user | length > 0
      - pangolin_smtp_pass | length > 0
      - pangolin_email_no_reply | length > 0
    fail_msg: >
      pangolin_enable_email is true, but SMTP settings are missing. Set
      pangolin_smtp_host, pangolin_smtp_port, pangolin_smtp_user,
      pangolin_smtp_pass, and pangolin_email_no_reply.
  when: pangolin_enable_email | bool

- name: Validate Pangolin trusted proxy CIDRs
  ansible.builtin.assert:
    that:
      - pangolin_trusted_proxy_cidrs is iterable
      - pangolin_trusted_proxy_cidrs is not string
    fail_msg: "pangolin_trusted_proxy_cidrs must be a list of CIDR strings."

- name: Validate Pangolin integration API settings
  ansible.builtin.assert:
    that:
      - pangolin_integration_api_domain | length > 0
      - pangolin_integration_api_port | int > 0
    fail_msg: >
      pangolin_enable_integration_api is true, but pangolin_integration_api_domain or
      pangolin_integration_api_port is missing.
  when: pangolin_enable_integration_api | bool

- name: Validate Pangolin private config
  ansible.builtin.assert:
    that:
      - pangolin_private_config is mapping
    fail_msg: "pangolin_private_config must be a dictionary."
