---
- name: Validate Pangolin configuration
  ansible.builtin.include_tasks: assert.yaml

- name: Validate Pangolin runtime availability for {{ pangolin_runtime }}
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/assert_container_runtime.yaml"
  vars:
    container_runtime_command: "{{ pangolin_runtime }}"

- name: Create Pangolin directory structure
  ansible.builtin.include_tasks: directories.yaml

- name: Render Pangolin env file
  ansible.builtin.include_tasks: env.yaml

- name: Render Pangolin config files
  ansible.builtin.include_tasks: config.yaml
