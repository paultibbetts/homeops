---
# Public-safe defaults. Override locally in ansible/group_vars/mysql/zz-local.yaml.
mysql_disable_log_bin: true

mysql_databases:
  - name: freshrss
  - name: gitea
  - name: uptime_monitor

mysql_users:
  - name: freshrss
    host: "{{ mysql_freshrss_host }}"
    password: "{{ vault_freshrss_database_password }}"
    priv: "freshrss.*:ALL"
  - name: gitea
    host: "{{ mysql_gitea_host }}"
    password: "{{ vault_gitea_database_password }}"
    priv: "gitea.*:ALL"
  - name: uptime
    host: "{{ mysql_uptime_host }}"
    password: "{{ vault_uptime_database_password }}"
    priv: "uptime_monitor.*:SELECT"
