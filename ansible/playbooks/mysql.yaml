---
- name: MySQL
  hosts: mysql
  gather_facts: true
  become: true
  pre_tasks:
    - name: Update repositories cache
      ansible.builtin.apt:
        update_cache: true
  roles:
    - role: geerlingguy.mysql
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-mysql.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"
    healthcheck: "{{ mysql_backup_healthcheck | default('curl -fsS -m 10 --retry 5 -o /dev/null https://healthchecks.example.com/ping/example-mysql') }}"
  tasks:
    - name: Allow passwordless MySQL commands
      ansible.builtin.copy:
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ vault_mysql_root_password }}
    - name: Backup
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: /var/backups/mysql-dumps
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: "{{ (playbook_dir | dirname) ~ '/files/backups/' ~ backup_script_name }}"
            dest: "{{ backup_script }}"
            mode: "0755"
            owner: root
            group: root
        - name: Add script to CRON
          ansible.builtin.cron:
            name: mysql backup
            hour: "1"
            minute: "0"
            job: "{{ backup_script }} && {{ healthcheck }}"
