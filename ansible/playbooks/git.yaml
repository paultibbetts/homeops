---
- name: Git
  hosts: git
  gather_facts: true
  become: true
  roles:
    - role: gitea
  vars:
    backup_script_directory: /usr/local/bin/
    backup_script_name: backup-gitea.sh
    backup_script: "{{ backup_script_directory }}{{ backup_script_name }}"
    healthcheck: "{{ git_backup_healthcheck | default('curl -fsS -m 10 --retry 5 -o
      /dev/null https://healthchecks.example.com/ping/example-git') }}"
  tasks:
    - name: Backup
      tags:
        - backup
      block:
        - name: Ensure backup directory exists
          ansible.builtin.file:
            path: /var/backups/gitea
            state: directory
            owner: git
            group: git
            mode: "0700"
        - name: Write backup script
          ansible.builtin.copy:
            src: "{{ (playbook_dir | dirname) ~ '/files/backups/' ~ backup_script_name }}"
            dest: "{{ backup_script }}"
            mode: "0755"
            owner: root
            group: root
        - name: Add script to CRON
          ansible.builtin.cron:
            name: gitea backup
            hour: "3"
            minute: "0"
            job: "{{ backup_script }} && {{ healthcheck }}"

- name: Gitea Runner
  hosts: gitea_runner
  gather_facts: true
  become: true
  vars:
    docker_daemon_dns_servers:
      - "{{ hostvars[groups['dns'][0]].ansible_host }}"
  tasks:
    - name: Install Docker
      ansible.builtin.import_role:
        name: geerlingguy.docker

    - name: Ensure Docker config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker daemon DNS
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ {'dns': docker_daemon_dns_servers} | to_nice_json }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Apply Docker daemon configuration
      ansible.builtin.meta: flush_handlers

    - name: Install Gitea runner
      ansible.builtin.import_role:
        name: gitea_runner
  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
