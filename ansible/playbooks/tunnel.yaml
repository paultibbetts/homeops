---
- name: Pangolin tunnel edge
  hosts: tunnel:&site_edge
  gather_facts: true
  become: true
  roles:
    - role: geerlingguy.docker
    - role: pangolin
    - role: pangolin_machine_client
      when: pangolin_beszel_machine_client_enabled | bool
      vars:
        pangolin_machine_client_version: "{{ pangolin_beszel_machine_client_version }}"
        pangolin_machine_client_id: "{{ vault_pangolin_beszel_machine_client_id | default('') }}"
        pangolin_machine_client_secret: "{{ vault_pangolin_beszel_machine_client_secret | default('') }}"
        pangolin_machine_client_endpoint: "{{ vault_newt_endpoint }}"
        pangolin_machine_client_target_host: "{{ hostvars[groups['monpi'][0]].ansible_host }}"
        pangolin_machine_client_target_port: 8090
      tags:
        - pangolin_beszel_machine_client
  tags:
    - pangolin

- name: Newt tunnel home
  hosts: tunnel:&site_home
  become: true
  vars:
    newt_endpoint: "{{ vault_newt_endpoint }}"
    newt_id: "{{ vault_newt_id }}"
    newt_secret: "{{ vault_newt_secret }}"
  roles:
    - role: newt
  tags:
    - newt
