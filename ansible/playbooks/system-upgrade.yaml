---
- name: System upgrade
  hosts: all
  become: true
  tasks:
    - name: Update and Upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: true
        autoremove: true

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Show hosts that need reboot
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs reboot"
      when: reboot_required.stat.exists

    - name: Reboot if requested and required
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot_required.stat.exists
        - reboot | default(false) | bool
